name: TestPyPI rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: make check test build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Rebuild wheel from source distribution
        run: uv build --wheel dist/*.tar.gz --out-dir "$RUNNER_TEMP/from-sdist"
      - name: Install wheel outside the source checkout
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" - <<'PY'
          import numpy as np
          import xarray as xr
          import xarrayrf as xrf
          import xarrayrf.native

          space = xrf.ReferenceFrame.local(xrf.CoordinateSystem(("x", "y"), ("mm", "mm")))
          transform = xrf.AffineTransform(
              source=xrf.ArrayCoordinates(("row", "column"), ("1", "1")),
              target=space,
              target_axes=("x", "y"),
              basis_vectors={"row": (0.0, 0.5), "column": (0.5, 0.0)},
              translation=(10.0, 20.0),
          )
          image = xr.DataArray(
              np.arange(12.0).reshape(3, 4),
              dims=("row", "column"),
              coords={"row": np.arange(3), "column": np.arange(4)},
          )
          crop = (image.rf.frame(transform, dims=("row", "column")) * 2).isel(
              column=slice(1, 3)
          )
          np.testing.assert_allclose(
              crop.rf.geometry.point_at(row=0, column=0).values,
              [10.5, 20.0],
              rtol=0,
              atol=1e-12,
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
